<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style/style.css">
  <script src="https://kit.fontawesome.com/121ef5a672.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>Dashboard Estatístico</title>
  <style>
    .kpi-container {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .kpi-card {
      flex: 1;
      background-color: #f8f9fa;
      padding: 20px;
      border: 1px solid #ced4da;
      border-radius: 5px;
      text-align: center;
    }

    .kpi-card h3 {
      margin-bottom: 10px;
      font-size: 1.2rem;
      color: #495057;
    }

    .kpi-card p {
      font-size: 2rem;
      font-weight: bold;
      color: #212529;
      margin: 0;
    }

    .charts-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .chart-card {
      flex: 1;
      min-width: 300px;
      background-color: #ffffff;
      padding: 15px;
      border: 1px solid #ced4da;
      border-radius: 5px;
    }
    
    .chart-card h3 {
      text-align: center;
      color: #495057;
      margin-bottom: 15px;
      font-size: 1.1rem;
    }

    .chart-wrapper {
      position: relative;
      height: 300px;
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">AgentMM</div>
      <nav id="nav">
        <a onclick="navegarPara('dashboard')" data-page="dashboard" class="active"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a onclick="navegarPara('chat')" data-page="chat"><i class="fa-regular fa-comment-dots"></i> Chat / Memória</a>
        <a onclick="navegarPara('agentes')" data-page="agentes"><i class="fa-solid fa-robot"></i> Agentes</a>
        <a onclick="navegarPara('categoriaAgente')" data-page="categorias"><i class="fa-solid fa-layer-group"></i> Categorias</a>
        <a onclick="navegarPara('canais')" data-page="canais"><i class="fa-solid fa-globe"></i> Canais</a>
        <a onclick="navegarPara('usuarios')" data-page="usuarios"><i class="fa-solid fa-user"></i> Usuários</a>
      </nav>
      <div class="user-info">
        <strong id="user-logged">Usuário</strong>
        <span id="user-perfil">Perfil</span>
        <br><br>
        <a href="#" id="logout-link" style="color:var(--danger);font-size:.8rem">Sair</a>
      </div>
    </aside>

    <main id="main">
      <div id="page-content">
        <div id="topbar">
          <h2>Estatísticas do Sistema</h2>
        </div>
        <div class="kpi-container">
          <div class="kpi-card">
            <h3>Total de Sessões</h3>
            <p id="kpi-sessoes">0</p>
          </div>
          
          <div class="kpi-card">
            <h3>Mensagens Trocadas</h3>
            <p id="kpi-mensagens">0</p>
          </div>

          <div class="kpi-card">
            <h3>Média (Mensagens / Sessão)</h3>
            <p id="kpi-media">0</p>
          </div>

          <div class="kpi-card">
            <h3>Agente Mais Usado</h3>
            <p id="kpi-top-agente" style="font-size: 1.5rem; line-height: 2.2rem;">-</p>
          </div>
        </div>

        <div class="charts-container">
          <div class="chart-card">
            <h3>Mensagens por Agente</h3>
            <div class="chart-wrapper">
              <canvas id="graficoMensagensAgente"></canvas>
            </div>
          </div>
          
          <div class="chart-card">
            <h3>Sessões por Agente</h3>
            <div class="chart-wrapper">
              <canvas id="graficoSessoesAgente"></canvas>
            </div>
          </div>

          <div class="chart-card">
            <h3>Sessões por Canal</h3>
            <div class="chart-wrapper">
              <canvas id="graficoSessoesCanal"></canvas>
            </div>
          </div>
        </div>
        
      </div>
    </main>
  </div>

  <script src="scripts/app.js"></script>
  <script src="scripts/dashboard.js"></script>
</body>

</html>
